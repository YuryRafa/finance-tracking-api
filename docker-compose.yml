services:
  db:
    image: postgres:16
    container_name: transactions-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: transactions_user
      POSTGRES_PASSWORD: transactions_password
      POSTGRES_DB: transactions_api
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactions_user -d transactions_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: transactions-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://transactions_user:transactions_password@db:5432/transactions_api
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports:
      - "3336:3336"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: